name: git-profile-koi
description:
  Draw a GitHub account's koi from its public activity as a looping GIF, a still
  PNG, and a preview, for a profile README.
branding:
  icon: droplet
  color: blue

inputs:
  login:
    description: Account whose koi to draw.
    default: ${{ github.repository_owner }}
  body:
    description:
      Body color, one of white, black, asagi, tea, gold, or platinum, or auto
      to use the color that suits the scene.
    default: white
  scene:
    description:
      Pond to swim the koi through. none keeps the plain koi; auto picks the
      season from the date (and rain on about one day in seven outside
      summer); or name one of spring, summer, autumn, winter, rain, or night.
    default: none
  night:
    description:
      Also draw koi-night.gif, the koi under street lamps, for viewers in dark
      mode. true or false.
    default: "false"
  output-dir:
    description:
      Folder, relative to the workspace, that receives koi.gif, koi.png, and
      preview.html.
    default: koi
  token:
    description:
      Token for reading the account's public data. Keep the built-in token,
      since the Action's process holds whatever token it is given and the
      built-in one reaches only this repository, for this job.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download the git-koi release this Action belongs to
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        version=$(grep -m1 '^version' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        repository=$(grep -m1 '^repository' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *)
            echo "git-koi has no build for $RUNNER_OS $RUNNER_ARCH; use ubuntu-latest" >&2
            exit 1
            ;;
        esac
        if [ "$RUNNER_OS" = Windows ]; then
          archive="git-koi-$version-$target.zip"
        else
          archive="git-koi-$version-$target.tar.gz"
        fi
        install_dir="$RUNNER_TEMP/git-koi"
        mkdir -p "$install_dir"
        if ! gh release download "v$version" --repo "$repository" --dir "$install_dir" \
            --pattern "$archive" --pattern "$archive.sha256"; then
          echo "release v$version has no asset $archive; reference the Action at a release tag" >&2
          exit 1
        fi
        cd "$install_dir"
        if command -v sha256sum > /dev/null; then
          sha256sum -c "$archive.sha256"
        else
          shasum -a 256 -c "$archive.sha256"
        fi
        case "$archive" in
          *.zip) unzip -q "$archive" ;;
          *) tar -xzf "$archive" ;;
        esac
        echo "$install_dir/git-koi-$version-$target" >> "$GITHUB_PATH"
    - name: Collect the account snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KOI_LOGIN: ${{ inputs.login }}
      run:
        git-koi collect "$KOI_LOGIN" --output "$RUNNER_TEMP/koi-snapshot.json"
    - name: Set up the pond renderer
      if: inputs.scene != 'none' || inputs.night == 'true'
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/pond-venv"
        if [ -x "$RUNNER_TEMP/pond-venv/bin/python" ]; then
          py="$RUNNER_TEMP/pond-venv/bin/python"
        else
          py="$RUNNER_TEMP/pond-venv/Scripts/python.exe"
        fi
        "$py" -m pip install --quiet --disable-pip-version-check "pillow==11.3.0"
        echo "POND_PY=$py" >> "$GITHUB_ENV"
    - name: Choose the scene
      id: choose
      if: inputs.scene != 'none'
      shell: bash
      env:
        KOI_SCENE: ${{ inputs.scene }}
      run: |
        if [ "$KOI_SCENE" = auto ]; then
          "$POND_PY" "$GITHUB_ACTION_PATH/scenes/pond.py" plan >> "$GITHUB_OUTPUT"
        else
          "$POND_PY" "$GITHUB_ACTION_PATH/scenes/pond.py" plan --scene "$KOI_SCENE" >> "$GITHUB_OUTPUT"
        fi
    - name: Render the koi
      shell: bash
      env:
        KOI_BODY: ${{ inputs.body != 'auto' && inputs.body || steps.choose.outputs.body || 'white' }}
        KOI_OUTPUT_DIR: ${{ inputs.output-dir }}
      run:
        git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir
        "$KOI_OUTPUT_DIR" --body "$KOI_BODY"
    - name: Swim the koi through the pond
      if: inputs.scene != 'none'
      shell: bash
      env:
        KOI_SCENE: ${{ steps.choose.outputs.scene }}
        KOI_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        "$POND_PY" "$GITHUB_ACTION_PATH/scenes/pond.py" render --koi "$KOI_OUTPUT_DIR/koi.gif" \
          --scene "$KOI_SCENE" --out "$KOI_OUTPUT_DIR/koi.gif"
    - name: Draw the night koi
      if: inputs.night == 'true'
      shell: bash
      env:
        KOI_BODY: ${{ inputs.body != 'auto' && inputs.body || 'platinum' }}
        KOI_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir "$RUNNER_TEMP/koi-night" --body "$KOI_BODY"
        "$POND_PY" "$GITHUB_ACTION_PATH/scenes/pond.py" render --koi "$RUNNER_TEMP/koi-night/koi.gif" \
          --scene night --out "$KOI_OUTPUT_DIR/koi-night.gif"
