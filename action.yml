name: git-profile-koi
description:
  Draw a GitHub account's koi from its public activity as a looping GIF, a still
  PNG, and a preview, for a profile README.
branding:
  icon: droplet
  color: blue

inputs:
  login:
    description: Account whose koi to draw.
    default: ${{ github.repository_owner }}
  body:
    description:
      Body color, one of white, black, asagi, tea, gold, or platinum, or auto
      for the color that suits the season (with scene).
    default: white
  scene:
    description:
      Season of the pond. none keeps the plain koi. auto follows the snapshot's
      date (March to May spring, June to August summer, September to November
      autumn, December to February winter), or fix one of spring, summer,
      autumn, or winter.
    default: none
  weather:
    description:
      auto (rain on about one day in seven, any season but winter, which snows),
      clear, or rain.
    default: auto
  night:
    description:
      Also draw koi-night.gif, the same pond at night with the same weather, for
      viewers in dark mode. true or false.
    default: "false"
  size:
    description:
      wide (352 px, the koi full size, a broad garden) or compact (256 px, the
      koi at 90%, a narrow garden).
    default: wide
  garden:
    description:
      What surrounds the pond. garden (moss bank and moss islands in raked
      gravel), islands, bank, gravel, deck (oak), deckdark, deckold (old, mossy
      oak), deckgrey, deckwalnut, or mist (no edge, the water fades out).
    default: garden
  lights:
    description:
      Night lights. reflect (only their reflections on the water), onefloat,
      floating, euro (old European lamps), toro (stone lanterns), chinese (paper
      lanterns), string, or none.
    default: reflect
  moon:
    description:
      The moon on the water at night. lines, round, halo, crescent, glade, or
      none.
    default: lines
  drops:
    description:
      random (falling leaves and petals land somewhere new each day) or fixed
      (the same spots every day).
    default: random
  koi:
    description: one, or three to share the pond with two more koi.
    default: one
  night-body:
    description:
      The body at night, as `body`; auto is platinum, a pale koi that catches
      the lamplight.
    default: auto
  depth:
    description:
      under (the koi swims beneath the surface, under lily pads, leaves and
      reflections) or top (drawn over everything, as plain git-koi).
    default: under
  layout:
    description:
      pond (the pond alone) or garden (a wider picture with the pond on the
      left, a boardwalk out to a deck with the last year's contributions in a
      planter, the activity overview as a garden bed, and a bench under a lamp;
      koi-pond.gif and koi-pond-night.gif are then the pond alone, for narrow
      screens). The garden needs size wide.
    default: pond
  scale:
    description:
      1, or 2 to draw each pixel 2 by 2 so the picture stays sharp on
      high-density screens when shown at its usual size.
    default: "1"
  output-dir:
    description:
      Folder, relative to the workspace, that receives koi.gif, koi.png, and
      preview.html.
    default: koi
  token:
    description:
      Token for reading the account's public data. Keep the built-in token,
      since the Action's process holds whatever token it is given and the
      built-in one reaches only this repository, for this job.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download the git-koi release this Action belongs to
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        version=$(grep -m1 '^version' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        repository=$(grep -m1 '^repository' "$GITHUB_ACTION_PATH/Cargo.toml" | cut -d'"' -f2)
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          *)
            echo "git-koi has no build for $RUNNER_OS $RUNNER_ARCH; use ubuntu-latest" >&2
            exit 1
            ;;
        esac
        if [ "$RUNNER_OS" = Windows ]; then
          archive="git-koi-$version-$target.zip"
        else
          archive="git-koi-$version-$target.tar.gz"
        fi
        install_dir="$RUNNER_TEMP/git-koi"
        mkdir -p "$install_dir"
        if ! gh release download "v$version" --repo "$repository" --dir "$install_dir" \
            --pattern "$archive" --pattern "$archive.sha256"; then
          echo "release v$version has no asset $archive; reference the Action at a release tag" >&2
          exit 1
        fi
        cd "$install_dir"
        if command -v sha256sum > /dev/null; then
          sha256sum -c "$archive.sha256"
        else
          shasum -a 256 -c "$archive.sha256"
        fi
        case "$archive" in
          *.zip) unzip -q "$archive" ;;
          *) tar -xzf "$archive" ;;
        esac
        echo "$install_dir/git-koi-$version-$target" >> "$GITHUB_PATH"
    - name: Collect the account snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KOI_LOGIN: ${{ inputs.login }}
      run:
        git-koi collect "$KOI_LOGIN" --output "$RUNNER_TEMP/koi-snapshot.json"
    - name: Render the koi
      shell: bash
      env:
        KOI_BODY: ${{ inputs.body != 'auto' && inputs.body || 'white' }}
        KOI_OUTPUT_DIR: ${{ inputs.output-dir }}
      run:
        git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir
        "$KOI_OUTPUT_DIR" --body "$KOI_BODY"
    - name: Swim the koi through the pond
      if: inputs.scene != 'none'
      shell: bash
      env:
        KOI_OUTPUT_DIR: ${{ inputs.output-dir }}
        KOI_SEASON: ${{ inputs.scene }}
        KOI_WEATHER: ${{ inputs.weather }}
        KOI_NIGHT: ${{ inputs.night }}
        KOI_SIZE: ${{ inputs.size }}
        KOI_GARDEN: ${{ inputs.garden }}
        KOI_LIGHTS: ${{ inputs.lights }}
        KOI_MOON: ${{ inputs.moon }}
        KOI_DEPTH: ${{ inputs.depth }}
        KOI_DROPS: ${{ inputs.drops }}
        KOI_SCHOOL: ${{ inputs.koi }}
        KOI_BODY: ${{ inputs.body }}
        KOI_NIGHT_BODY: ${{ inputs.night-body }}
        KOI_LAYOUT: ${{ inputs.layout }}
        KOI_SCALE: ${{ inputs.scale }}
        KOI_LOGIN: ${{ inputs.login }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        night=()
        if [ "$KOI_NIGHT" = true ]; then night=(--night); fi
        activity=()
        if [ "$KOI_LAYOUT" = garden ]; then
          # the garden bed: the year's commits, pull requests, issues and reviews
          counts=$(gh api graphql -f login="$KOI_LOGIN" -f query='query($login: String!) {
            user(login: $login) { contributionsCollection { totalCommitContributions
            totalPullRequestContributions totalIssueContributions
            totalPullRequestReviewContributions } } }' --jq '.data.user.contributionsCollection
            | [.totalCommitContributions, .totalPullRequestContributions,
               .totalIssueContributions, .totalPullRequestReviewContributions]
            | map(tostring) | join(",")')
          activity=(--activity "$counts")
        fi
        git-koi pond "$RUNNER_TEMP/koi-snapshot.json" --output-dir "$KOI_OUTPUT_DIR" \
          --season "$KOI_SEASON" --weather "$KOI_WEATHER" --size "$KOI_SIZE" \
          --garden "$KOI_GARDEN" --lights "$KOI_LIGHTS" --moon "$KOI_MOON" \
          --depth "$KOI_DEPTH" --drops "$KOI_DROPS" --koi "$KOI_SCHOOL" \
          --body "$KOI_BODY" --night-body "$KOI_NIGHT_BODY" --layout "$KOI_LAYOUT" \
          --scale "$KOI_SCALE" "${night[@]}" "${activity[@]}"
